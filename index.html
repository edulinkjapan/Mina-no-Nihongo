html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(180deg,var(--glow),transparent 320px),var(--pat);background-repeat:no-repeat,repeat;color:var(--ink);font:17px/1.55 "Times New Roman",Times,"Hiragino Mincho ProN","Yu Mincho","MS Mincho","Noto Serif JP","Hiragino Sans","Yu Gothic","Meiryo",serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0 .5em;padding-bottom:8px;border-bottom:2px solid var(--gold)}h2{font-size:1.1rem;margin:1em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 14px rgba(0,0,0,.07)}
.mute{color:var(--mute);font-size:.9rem}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chip{padding:8px 0;text-align:center;border-radius:9px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button.on{background:var(--sel);border-color:var(--acc);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:linear-gradient(135deg,#2e7d32,#14451a);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--gold);border-radius:0 0 14px 14px;box-shadow:0 4px 14px rgba(20,69,26,.3);max-width:760px;margin:0 auto}.bar .timer{color:#f5e6b0}.bar .timer.low{color:#ffb4a8}.bar .lv{color:#ffb4a8}.bar .pri{background:#d4af37;border-color:#d4af37;color:#1b2b1c}body.inq::before{background:#1b5e20}
.bar b{flex:1}.timer{font-variant-numeric:tabular-nums;font-weight:700}.timer.low{color:var(--bad)}
.stem div{margin:2px 0;font-size:1.2rem;white-space:pre-wrap}
.hint{color:var(--mute);font-size:.88rem;margin-bottom:8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:11px;font-size:1.08rem;white-space:pre-wrap}
.opt i{font-style:normal;font-weight:700;color:var(--mute);min-width:1.4em}
.opt.sel{background:var(--sel);border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:6px 0;text-align:center}.grid .dn{background:var(--sel)}.grid .cur{border:2px solid var(--acc);font-weight:700}
.nav{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
.score{font-size:3.2rem;font-weight:800;color:var(--acc);line-height:1}
.rv{border-left:5px solid var(--line)}.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:8px}
.warn{background:var(--badbg);border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0}
.hide{display:none!important}.stem,.opt{-webkit-user-select:none;user-select:none}.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}.tbl th{color:var(--mute);font-weight:600}.sc{overflow-x:auto}.pb{height:8px;min-width:80px;background:var(--line);border-radius:4px}.pb i{display:block;height:100%;background:var(--acc);border-radius:4px}.red{color:var(--bad);font-weight:700}.tch{background:#2e7d32;color:#fff;border:1px solid var(--gold);font-weight:700;margin:4px 0 0;padding:5px 14px;font-size:.82rem;border-radius:999px;letter-spacing:.02em}.tch:hover{filter:brightness(1.1)}.co{font-weight:800;color:var(--grn);letter-spacing:.02em;font-size:1.05rem;margin:4px 0 2px}.hd{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}.hd .co{margin:0;flex:1}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:390px;margin:12px auto}
.lt{aspect-ratio:1/1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;line-height:1.1}
.lt b{font-size:1.1rem}.lt small{font-size:.56rem;color:var(--mute);margin-top:2px}
.lt.on{background:var(--grn);color:var(--ong);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.lt.on small{color:inherit;opacity:.8}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;line-height:1.35}
.ex small{color:var(--mute)}.ex.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.pill{font-weight:800;letter-spacing:.12em;color:var(--grn);white-space:nowrap}
.cn{line-height:1.3;text-align:center;flex:0 1 auto}.cn .l1{font-size:clamp(.82rem,2.8vw,.98rem);font-weight:700;letter-spacing:.3em;color:var(--grn)}.cn .l2{font-size:clamp(.9rem,3.2vw,1.12rem);font-weight:800;letter-spacing:.03em;color:var(--g2)}
.ttl{font-size:clamp(.8rem,2.6vw,.98rem);font-weight:700;letter-spacing:.08em;text-align:center;color:var(--ttl);border-bottom:0;padding-bottom:0;margin:3px 0 0}.ttl:after{content:"";display:block;width:64px;height:2px;background:var(--gold);margin:8px auto 0}
.hero{max-width:620px;margin:16px auto;border-top:3px solid var(--gold);padding:22px}
.step{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 6px}.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--grn);color:var(--ong);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:10px 0}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 8px;border-radius:12px;border:1.5px solid var(--tlb);color:var(--tlf);background:var(--tlbg);font:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.tile:hover{transform:translateY(-1px);background:var(--tlon)}.tile b{font-size:.98rem}.tile small{font-size:.7rem;opacity:.85}
.tile.on{background:var(--tlon);border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.5)}.tile.on:after{content:"✓";position:absolute;top:3px;right:7px;color:var(--grn);font-size:.8rem;font-weight:800}
.tile.lock{background:var(--lkbg);border-color:var(--lkb);color:var(--lkf)}.tile.lock:hover{background:var(--lkbg)}.tile .lkt{font-size:.66rem;font-weight:700}
.lt.lkm{border-color:var(--lkb);box-shadow:inset 0 0 0 1px var(--lkb)}.bb.purple{background:#7c3aed}
.lt.lk{background:var(--lkbg);border-color:var(--lkb);color:var(--lkf)}.lt.lk small{color:inherit}
.fbk{border:0;background:none;color:var(--mute);font-size:.78rem;padding:2px 6px;white-space:nowrap}.fbk:hover{color:var(--bad)}.mdl select,.mdl textarea{width:100%}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.mdl .card{max-width:430px;width:100%;margin:0;border-top:3px solid var(--gold)}
.cta{width:100%;padding:14px;margin-top:16px;font-size:1.05rem;font-weight:800;letter-spacing:.03em;color:var(--bad);background:var(--card);border:2px solid var(--bad);border-radius:12px}.cta:hover{background:var(--badbg)}.cta.solid{background:#c62828;color:#fff;border-color:#c62828}.cta.solid:hover{background:#c62828;filter:brightness(1.1)}
.bb{color:#fff;border:0;font-weight:600;padding:4px 9px;border-radius:7px;font-size:.74rem}.bb:hover{filter:brightness(1.12)}.bb.blue{background:#1a73e8}.bb.amber{background:#d97706}.bb.red{background:#c62828}.bb.green{background:#2e7d32}.bb.teal{background:#00897b}.bb.gray{background:#6b7280}
.acts{display:flex;gap:4px;flex-wrap:wrap}.tbl td small{display:block;color:var(--mute)}.edrow td{background:var(--sel)}
.code{font-size:2rem;font-weight:800;letter-spacing:.25em;color:var(--grn)}
.lv{color:var(--bad);font-size:.85rem;font-weight:700}
</style></head><body>
